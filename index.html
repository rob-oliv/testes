<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>momento.</title>

<style>
:root{
  --bg:#f4efe6;
  --p:#fbf8f1;
  --ink:#171614;
  --mu:#6f675d;
  --ln:#ddd5c8;
  --red:#ef2e22;
  --rs:#f9ded8;
  --green:#dce7d3;
  --shadow:rgba(23,22,20,.08);
}

*{box-sizing:border-box}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  padding-bottom:88px;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(460px,100%);
  margin:auto;
  padding:0 18px 32px;
}

.top{
  height:68px;
  display:grid;
  grid-template-columns:40px 1fr 40px;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.top .tiny{
  text-align:center;
}

.ib{
  width:38px;
  height:38px;
  border:1px solid var(--ln);
  border-radius:50%;
  background:var(--p);
  color:var(--ink);
  display:grid;
  place-items:center;
  font-size:19px;
}

h1,h2,h3,h4{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  margin:0;
}

h1{
  font-size:54px;
  line-height:.9;
  letter-spacing:-3px;
}

h2{
  font-size:34px;
  line-height:1;
  letter-spacing:-1.6px;
}

h3{
  font-size:21px;
}

h4{
  font-size:17px;
}

p{
  line-height:1.65;
}

.mu{
  color:var(--mu);
}

.tiny{
  color:var(--mu);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.hero{
  padding:32px 0 25px;
}

.hero .asterisk{
  color:var(--red);
  font:72px Georgia,serif;
  line-height:.5;
  margin-bottom:18px;
}

.hero p{
  max-width:350px;
  margin:18px 0 0;
  color:var(--mu);
  font-size:14px;
}

.card{
  background:var(--p);
  border:1px solid var(--ln);
  border-radius:22px;
  padding:20px;
  box-shadow:0 12px 35px var(--shadow);
}

.hero-card{
  min-height:180px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 20%,rgba(239,46,34,.22),transparent 25%),
    linear-gradient(135deg,#fbf8f1,#e8dfd1);
}

.hero-card .big{
  font:74px Georgia,serif;
  position:absolute;
  right:18px;
  bottom:-5px;
  color:var(--red);
  opacity:.9;
}

.hero-card .date{
  font:13px Georgia,serif;
  color:var(--mu);
  margin-bottom:12px;
}

.hero-card strong{
  font:28px/1.05 Georgia,serif;
  display:block;
  max-width:260px;
}

.hero-card small{
  display:block;
  margin-top:12px;
  color:var(--mu);
  max-width:260px;
  line-height:1.5;
}

.sh{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 0 12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.item{
  width:100%;
  border:1px solid var(--ln);
  border-radius:17px;
  padding:15px 16px;
  background:var(--p);
  color:var(--ink);
  text-align:left;
  display:flex;
  align-items:center;
  gap:13px;
}

.item .ico{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--rs);
  color:var(--red);
  font:20px Georgia,serif;
}

.item .copy{
  min-width:0;
  flex:1;
}

.item strong{
  display:block;
  font:16px Georgia,serif;
  margin-bottom:3px;
}

.item small{
  display:block;
  color:var(--mu);
  font-size:11px;
}

.item .arrow{
  color:var(--mu);
  font-size:18px;
}

.progress{
  height:5px;
  background:var(--ln);
  border-radius:99px;
  overflow:hidden;
  margin-top:13px;
}

.progress i{
  display:block;
  height:100%;
  background:var(--red);
  border-radius:99px;
}

.q{
  margin:20px 0;
  padding:20px;
  background:var(--rs);
  border-radius:20px;
  font:20px/1.35 Georgia,serif;
}

.blk{
  padding:18px 0;
  border-top:1px solid var(--ln);
}

.blk p{
  font-size:14px;
  color:var(--mu);
  margin:8px 0 0;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:1px solid var(--ln);
  border-radius:16px;
  background:var(--p);
  color:var(--ink);
  padding:15px;
  outline:none;
  line-height:1.6;
}

textarea:focus{
  border-color:var(--red);
}

.btn{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:15px;
  background:var(--ink);
  color:var(--p);
  font-weight:600;
  margin-top:12px;
}

.btn.red{
  background:var(--red);
}

.btn.light{
  background:var(--p);
  color:var(--ink);
  border:1px solid var(--ln);
}

.quote{
  font:24px/1.35 Georgia,serif;
  margin:20px 0;
}

.scripture{
  background:var(--green);
  border-radius:20px;
  padding:20px;
  margin:18px 0;
}

.scripture .tiny{
  color:#53604b;
}

.scripture p{
  font:19px/1.55 Georgia,serif;
  margin:8px 0 0;
}

.prayer{
  background:var(--ink);
  color:var(--p);
  border-radius:22px;
  padding:22px;
  margin-top:20px;
}

.prayer p{
  color:#e8e1d8;
  font-family:Georgia,serif;
}

.done{
  display:flex;
  gap:10px;
  align-items:center;
  padding:14px;
  border-radius:15px;
  background:var(--green);
  margin:15px 0;
  font-size:13px;
}

/* SALMO */

.psalm-days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin:18px 0;
}

.psalm-day{
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid var(--ln);
  background:var(--p);
  color:var(--ink);
  display:grid;
  place-items:center;
  font-size:11px;
}

.psalm-day.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.psalm-day.complete{
  background:var(--green);
  border-color:var(--green);
}

.psalm-box{
  background:var(--p);
  border:1px solid var(--ln);
  border-radius:22px;
  padding:22px;
}

.psalm-box .verse{
  font:23px/1.45 Georgia,serif;
  margin:0 0 20px;
}

.psalm-box .reference{
  color:var(--red);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
}

/* BANHOS */

.bath-card{
  padding:20px;
  border-radius:22px;
  background:var(--p);
  border:1px solid var(--ln);
  margin-bottom:10px;
}

.bath-card .bath-icon{
  font-size:34px;
  margin-bottom:15px;
}

.bath-card h3{
  margin-bottom:7px;
}

.ingredients{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.ingredients span{
  padding:6px 9px;
  border:1px solid var(--ln);
  border-radius:99px;
  font-size:10px;
  color:var(--mu);
}

.timer{
  text-align:center;
  padding:25px 0 10px;
}

.timer-number{
  font:70px Georgia,serif;
  letter-spacing:-4px;
}

.timer-actions{
  display:flex;
  gap:8px;
}

.timer-actions .btn{
  margin:0;
}

/* JAPA */

.japa-wrap{
  text-align:center;
  padding:15px 0;
}

.japa-count{
  font:64px Georgia,serif;
  letter-spacing:-3px;
}

.japa-sub{
  color:var(--mu);
  font-size:12px;
}

.japa-beads{
  width:270px;
  height:270px;
  margin:22px auto;
  position:relative;
}

.bead{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--p);
  border:1px solid var(--ink);
  transform:translate(-50%,-50%);
  transition:.15s;
}

.bead.active{
  background:var(--red);
  border-color:var(--red);
  transform:translate(-50%,-50%) scale(1.35);
}

.japa-main{
  width:130px;
  height:130px;
  border-radius:50%;
  border:1px solid var(--ln);
  background:var(--p);
  color:var(--ink);
  font:18px Georgia,serif;
}

.japa-controls{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.japa-controls .btn{
  margin:0;
}

/* TAROT */

.tarot-wrap{
  perspective:1200px;
  width:min(270px,78vw);
  margin:18px auto 22px;
}

.tarot-card{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:2/3;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.75,.2,1);
  border:0;
  padding:0;
  background:none;
}

.tarot-card.flipped{
  transform:rotateY(180deg);
}

.tarot-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:15px;
  overflow:hidden;
}

.tarot-back{
  background:
    radial-gradient(circle at center,rgba(239,46,34,.12),transparent 42%),
    var(--ink);
  border:7px solid var(--p);
  box-shadow:0 24px 55px rgba(0,0,0,.25);
  display:grid;
  place-items:center;
}

.tarot-back::before{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:8px;
}

.tarot-back::after{
  content:"✦";
  position:absolute;
  width:74%;
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.4);
  transform:rotate(45deg);
  display:grid;
  place-items:center;
  color:var(--red);
  font:42px Georgia,serif;
}

.tarot-back-mark{
  position:relative;
  z-index:2;
  color:#fff;
  font:400 25px Georgia,serif;
  letter-spacing:-1px;
}

.tarot-front{
  transform:rotateY(180deg);
  background:#f7f0e3;
  color:#181512;
  border:6px solid #181512;
  padding:8px;
  box-shadow:0 24px 55px rgba(0,0,0,.25);
}

.tarot-inner{
  width:100%;
  height:100%;
  border:1px solid #181512;
  display:flex;
  flex-direction:column;
  padding:7px;
}

.tarot-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font:700 11px/1 Georgia,serif;
  letter-spacing:.08em;
}

.tarot-art{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px 2px;
}

.tarot-art svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.tarot-foot{
  text-align:center;
  border-top:1px solid #181512;
  padding:8px 2px 5px;
  font:700 13px/1 Georgia,serif;
  letter-spacing:.13em;
}

.tarot-instruction{
  text-align:center;
  color:var(--mu);
  font-size:12px;
  margin:-8px 0 18px;
}

.tarot-result{
  animation:tarotIn .5s ease both;
}

@keyframes tarotIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.tarot-meta{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:4px 0 12px;
  flex-wrap:wrap;
}

.tarot-meta span{
  font-size:11px;
  color:var(--mu);
  border:1px solid var(--ln);
  padding:6px 10px;
  border-radius:99px;
}

.tarot-history{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 0 8px;
  scrollbar-width:none;
}

.tarot-history::-webkit-scrollbar{
  display:none;
}

.tarot-history button{
  flex:0 0 auto;
  min-width:42px;
  height:42px;
  border:1px solid var(--ln);
  border-radius:50%;
  background:var(--p);
  font:14px Georgia,serif;
  color:var(--ink);
}

.tarot-history button.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

/* ASTRO */

.astro-wheel{
  width:100%;
  max-width:350px;
  margin:15px auto;
  display:block;
}

.astro-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.planet{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border:1px solid var(--ln);
  border-radius:14px;
  background:var(--p);
}

.planet span:first-child{
  font-family:Georgia,serif;
}

.planet small{
  color:var(--mu);
}

/* MAIS */

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.menu-card{
  min-height:125px;
  padding:18px;
  border-radius:20px;
  border:1px solid var(--ln);
  background:var(--p);
  text-align:left;
  color:var(--ink);
}

.menu-card b{
  display:block;
  font:19px Georgia,serif;
  margin-bottom:7px;
}

.menu-card small{
  color:var(--mu);
  line-height:1.4;
}

.danger{
  color:var(--red);
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(460px,100%);
  z-index:30;
  background:color-mix(in srgb,var(--p) 94%,transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--ln);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav button{
  border:0;
  background:none;
  color:var(--mu);
  padding:7px 2px;
  border-radius:12px;
  font-size:9px;
}

.nav button span{
  display:block;
  font:18px Georgia,serif;
  margin-bottom:3px;
}

.nav button.active{
  color:var(--red);
}

/* DARK */

body.dark{
  --bg:#171614;
  --p:#22201d;
  --ink:#f4efe6;
  --mu:#aaa196;
  --ln:#3a3631;
  --red:#ff5145;
  --rs:#3a211e;
  --green:#283327;
  --shadow:rgba(0,0,0,.25);
}

body.dark .hero-card{
  background:
    radial-gradient(circle at 85% 20%,rgba(239,46,34,.24),transparent 25%),
    linear-gradient(135deg,#22201d,#302b26);
}

body.dark .tarot-front{
  background:#eee5d7;
  color:#181512;
  border-color:#eee5d7;
}

body.dark .tarot-back{
  border-color:#22201d;
}

body.dark .scripture{
  color:#eee;
}

body.dark .tarot-art svg{
  filter:none;
}

/* MOBILE */

@media(max-width:370px){
  .app{
    padding-left:14px;
    padding-right:14px;
  }

  h2{
    font-size:30px;
  }

  .menu-grid{
    grid-template-columns:1fr;
  }

  .japa-beads{
    width:240px;
    height:240px;
  }
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tarot-card{transition:none}
  .tarot-result{animation:none}
}
</style>
</head>

  </button>

  <button data-a="go" data-v="japa">
    <span>◌</span>
    Japa
  </button>

  <button data-a="go" data-v="more">
    <span>＋</span>
    Mais
  </button>
</nav>

function esc(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function sv(k){
  LS.s(k,st[k]);
}

function todayIndex(){
  const a=new Date(st.start);
  const b=new Date(TD);
  const diff=Math.floor((b-a)/(1000*60*60*24));
  return Math.max(0,Math.min(6,diff));
}

function fmtDate(){
  return new Date().toLocaleDateString("pt-BR",{
    weekday:"long",
    day:"numeric",
    month:"long"
  });
}

          <h3>${esc(r[0])}</h3>
          <p class="mu" style="font-size:13px">${esc(r[1])}</p>

          <div class="ingredients">
            ${r[2].map(x=>`<span>${esc(x)}</span>`).join("")}
          </div>

          <div class="blk">
            <p>${esc(r[3])}</p>
          </div>

          <button class="btn light" data-a="bathTimer" data-i="${i}">

          </button>

        </div>
      `).join("")}

      <div class="card" style="margin-top:18px">
        <div class="tiny">atenção</div>
        <p style="font-size:12px;color:var(--mu)">
          Faça apenas práticas que sejam seguras para você.
          Evite aplicar ingredientes irritantes diretamente na pele
          e interrompa se houver qualquer reação.
        </p>
      </div>

    </div>
  `;
},

japa(){

  const total=st.j.t||108;
  const n=st.j.n||0;
  const pct=Math.round((n/total)*100);

  const beads=Array.from({length:108},(_,i)=>{

    const angle=(i/108)*Math.PI*2-Math.PI/2;
    const r=112;

    const x=135+r*Math.cos(angle);
    const y=135+r*Math.sin(angle);

    return `
      <span
        class="bead ${i<n?"active":""}"
        style="left:${x}px;top:${y}px"
      ></span>
    `;
  }).join("");

  return `
    <div class="top">
      <button class="ib" data-a="go" data-v="home">←</button>
      <span class="tiny">japamala</span>
      <span></span>
    </div>

    <div style="padding-top:20px;text-align:center">

      <div class="tiny">presença</div>
      <h2 style="margin-top:7px">108 momentos.</h2>

      <p class="mu">
        Toque no centro a cada repetição da sua oração,
        mantra ou frase de mentalização.
      </p>

      <div class="japa-wrap">

        <div class="japa-count">${n}</div>
        <div class="japa-sub">de ${total} contas · ${pct}%</div>

        <div class="japa-beads">
          ${beads}

          <button class="japa-main" data-a="japaTap">
            ${n===108?"completo":"tocar"}
          </button>
        </div>

        <div class="japa-controls">

          <button class="btn light" data-a="japaUndo">
            desfazer
          </button>

          <button class="btn light" data-a="japaReset">
            reiniciar
          </button>

        </div>

        <div class="scripture" style="text-align:left;margin-top:22px">
          <div class="tiny">mentalização</div>
          <p>
            Eu estou no caminho da prosperidade.
            Eu sou a prosperidade. Eu sou.
          </p>
        </div>

      </div>

    </div>
  `;
},

tarot(){

  const c=T[tz];
  const history=st.tarotHistory||[];

  return `
    <div class="top">
      <button class="ib" data-a="go" data-v="more">←</button>
      <span class="tiny">tarot do momento</span>
      <span></span>
    </div>

    <div style="padding-top:20px">

      <div class="tiny">uma carta</div>

      <h2 style="margin-top:7px">
        Uma carta para hoje.
      </h2>

      <p class="mu" style="margin:7px 0 2px">
        Não para prever o futuro. Para olhar o presente
        por outro ângulo.
      </p>

      <div class="tarot-wrap">

        <button
          class="tarot-card ${st.tarotFlipped?"flipped":""}"
          data-a="flip"
          aria-label="${st.tarotFlipped?"Carta revelada":"Virar carta"}"
        >

          <span class="tarot-face tarot-back">
            <span class="tarot-back-mark">momento.</span>
          </span>

          <span class="tarot-face tarot-front">

            <span class="tarot-inner">

              <span class="tarot-head">
                <span>${esc(c[1])}</span>
                <span>✦</span>
              </span>

              <span class="tarot-art">
                ${tarotSVG(c)}
              </span>

              <span class="tarot-foot">
                ${esc(c[0])}
              </span>

            </span>

          </span>

        </button>

      </div>

      <p class="tarot-instruction">
        ${
          st.tarotFlipped
          ?"Toque na carta para virá-la novamente."
          :"Toque na carta para revelar."
        }
      </p>

      ${
        st.tarotFlipped
        ? `
          <div class="tarot-result">

            <div class="tarot-meta">
              <span>${esc(c[1])}</span>
              <span>${esc(c[2])}</span>
            </div>

            <div class="q">
              ${esc(c[3])}
            </div>

            <div class="blk">
              <h4>Para contemplar</h4>
              <p>
                Esta carta pode ser usada como uma lente para observar
                o que já está acontecendo, sem precisar tratá-la como
                previsão ou resposta definitiva.
              </p>
            </div>

            <button class="btn red" data-a="draw">
              Tirar outra carta
            </button>

            <p class="tiny" style="margin-top:14px;line-height:1.6;text-align:center">
              Tarot no momento. é uma prática simbólica de reflexão.
            </p>

          </div>
        `
        :""
      }

      ${
        history.length
        ? `
          <div class="sh">
            <h3>Cartas recentes</h3>
            <span class="tiny">${history.length}</span>
          </div>

          <div class="tarot-history">
            ${
              history.slice().reverse().map(n=>`
                <button
                  class="${n===tz?"active":""}"
                  data-a="tarotPick"
                  data-i="${n}"
                  aria-label="${esc(T[n][0])}"
                >${esc(T[n][1])}</button>
              `).join("")
            }
          </div>
        `
        :""
      }

    </div>
  `;
},

astro(){

  const points=[
    [30,80,"Sol"],
    [105,45,"Lua"],
    [155,82,"Mercúrio"],
    [212,55,"Vênus"],
    [275,88,"Marte"],
    [325,140,"Júpiter"],
    [310,205,"Saturno"],
    [250,240,"Urano"],
    [170,245,"Netuno"],
    [90,215,"Plutão"]
  ];

  return `
    <div class="top">
      <button class="ib" data-a="go" data-v="more">←</button>
      <span class="tiny">mapa simbólico</span>
      <span></span>
    </div>

    <div style="padding-top:20px">

      <div class="tiny">24 · 05 · 1996</div>

      <h2 style="margin-top:7px">
        Seu céu como linguagem.
      </h2>

      <p class="mu">
        Esta leitura usa posições planetárias aproximadas da data

        um mapa natal completo.
      </p>

      <svg
        class="astro-wheel"
        viewBox="0 0 360 360"
        aria-label="Roda astrológica simbólica"
      >

        <circle
          cx="180"
          cy="180"
          r="145"
          fill="none"

          cy="180"

        />

        </text>

            <text

              y="${p[1]-12}"
              text-anchor="middle"

              fill="currentColor"
            >${p[2]}</text>
          </g>

      </svg>

      <div class="sh">
        <h3>Posições</h3>
        <span class="tiny">simbólico</span>
      </div>

      <div class="astro-list">

        ${PL.map(p=>`
          <div class="planet">
            <span>${p[0]} ${p[1]}</span>
            <small>${p[2]} · ${p[3]}</small>

      </div>

      <div class="card" style="margin-top:18px">
        <div class="tiny">como usar</div>

        </p>
      </div>

    </div>

},

more(){

  return `
    <div class="top">
      <button class="ib" data-a="go" data-v="home">←</button>
      <span class="tiny">mais</span>

    </div>

};

/* =========================================================
   AÇÕES
========================================================= */

const act={

go:d=>{
  V=d.v;
  if(V!=="baths" && timer){
    clearInterval(timer);
    timer=null;
  }
  draw();
  window.scrollTo({top:0,behavior:"smooth"});
},

completeDev:()=>{
  const i=todayIndex();
  st.did[i]=true;
  sv("did");
  draw();
},

saveNote:e=>{
  const i=todayIndex();
  st.notes[i]=e.target.value;
  sv("notes");
},

psalmDay:d=>{
  A=+d.i;
  draw();
},

nextPsalm:()=>{

  if(A===6){
    A=0;
  }else{
    A++;
  }

  draw();
},

bathTimer:d=>{

  if(timer){
    clearInterval(timer);
  }

  timerSec=600;

  V="baths";

  draw();

  timer=setInterval(()=>{

    timerSec--;

    const el=document.querySelector(".timer-number");

    if(el){

      const m=Math.floor(timerSec/60);
      const s=String(timerSec%60).padStart(2,"0");

      el.textContent=`${m}:${s}`;

    }

    if(timerSec<=0){

      clearInterval(timer);
      timer=null;

      const el=document.querySelector(".timer-number");

      if(el){
        el.textContent="feito.";
      }
    }

  },1000);

},

japaTap:()=>{

  if(st.j.n<st.j.t){

    st.j.n++;

    if(st.j.n>108){
      st.j.n=108;
    }

    sv("j");

    draw();
  }

},

japaUndo:()=>{

  if(st.j.n>0){

    st.j.n--;

    sv("j");

    draw();
  }

},

japaReset:()=>{

  st.j.n=0;
  sv("j");

  draw();
},

flip:()=>{

  st.tarotFlipped=!st.tarotFlipped;

  if(st.tarotFlipped){

    st.tarotHistory=st.tarotHistory||[];

    if(!st.tarotHistory.includes(tz)){

      st.tarotHistory.push(tz);

      st.tarotHistory=
        st.tarotHistory.slice(-8);
    }

    sv("tarotHistory");
  }

  sv("tarotFlipped");

  draw();
},

draw:()=>{

  let n;

  do{
    n=Math.floor(Math.random()*T.length);
  }while(n===tz && T.length>1);

  tz=n;

  st.tarotFlipped=false;

  sv("tarotFlipped");

  st.tarotHistory=st.tarotHistory||[];

  if(!st.tarotHistory.includes(tz)){

    st.tarotHistory.push(tz);

    st.tarotHistory=
      st.tarotHistory.slice(-8);
  }

  sv("tarotHistory");

  draw();

},

tarotPick:d=>{

  tz=+d.i;

  st.tarotFlipped=true;

  if(!st.tarotHistory.includes(tz)){

    st.tarotHistory.push(tz);

    st.tarotHistory=
      st.tarotHistory.slice(-8);
  }

  sv("tarotFlipped");
  sv("tarotHistory");

  draw();
},

theme:()=>{

  st.theme=
    st.theme==="dark"
    ?"light"
    :"dark";

  sv("theme");

  applyTheme();
  draw();
},

restart:()=>{

  const ok=
    confirm(
      "Quer realmente recomeçar a jornada? Suas notas não serão apagadas."
    );

  if(!ok)return;

  st.start=TD;
  st.did={};

  sv("start");
  sv("did");

  draw();
},

export:()=>{

  const data={

    momento:new Date().toLocaleString("pt-BR"),

    devocionais:st.notes,

    devocionaisConcluidos:st.did,

    cartasTarot:
      (st.tarotHistory||[])
      .map(i=>T[i][0])

  };

  const blob=
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download="momento-minhas-notas.json";

  a.click();

  URL.revokeObjectURL(url);
}

};

/* =========================================================
   EVENTOS
========================================================= */

document.addEventListener("click",e=>{

  const b=e.target.closest("[data-a]");

  if(!b)return;

  const action=b.dataset.a;

  if(act[action]){
    act[action](b.dataset);
  }

});

document.addEventListener("input",e=>{

  if(e.target.id==="note"){
    act.saveNote(e);
  }

});

/* =========================================================
   RENDER
========================================================= */

function draw(){

  const app=
    document.getElementById("app");

  const fn=
    VW[V]||VW.home;

  app.innerHTML=
    fn();

  updateNav();
}

function updateNav(){

  document.querySelectorAll(".nav button")
    .forEach(b=>{
      b.classList.toggle(
        "active",
        b.dataset.v===V
      );
    });
}

function applyTheme(){

  document.body.classList.toggle(
    "dark",
    st.theme==="dark"
  );

  const meta=
    document.querySelector('meta[name="theme-color"]');

  if(meta){
    meta.content=
      st.theme==="dark"
      ?" #171614"
      :"#f4efe6";
  }
}

/* =========================================================
   INÍCIO
========================================================= */

applyTheme();
draw();

</script>

</body>
</html>
